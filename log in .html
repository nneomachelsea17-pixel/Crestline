<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — Crestline</title>
<link rel="stylesheet" href="logs.css">
<link rel="stylesheet" href="log in .html">

</head>
<body class="auth">
<div class="bgfx">
  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="grid"></div>
  <div class="in">
    <a class="logo" href="index.html">Crest<span>line</span></a>
    <h1 style="margin-top:28px">Good to see you again.</h1>
    <p style="opacity:.8">Log in to check on your goals and see how your portfolio is doing.</p>
  </div>
</div>
<main class="formbox">
  <form id="fl" novalidate>
    <a class="logo dk" href="index.html">Crest<span>line</span></a>
    <h2>Log in</h2><span class="muted">Enter your details to continue.</span>
    <label for="le">Email</label><input id="le" type="email" autocomplete="email" placeholder="you@email.com">
    <label for="lp">Password</label>
    <div class="pw"><input id="lp" type="password" autocomplete="current-password" placeholder="Your password"><button type="button" class="eye">Show</button></div>
    <div class="err" id="fle"></div>
    <button class="btn full" type="submit">Log in</button>
    <p class="alt">New to Crestline? <a href="signup.html">Create an account</a></p>
  </form>
</main>
<script src="app.js"></script>
</body>
</html>
